<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>minesweep</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; background: #0b0f17; color: #e5e7eb; padding: 16px; user-select: none; }
  h1 { margin: 0; font-size: 20px; }
  .top { display: flex; gap: 12px; align-items: center; }
  .pill { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 6px 12px; font-variant-numeric: tabular-nums; }
  select, button { background: #1f2937; border: 1px solid #374151; color: #e5e7eb; padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  #grid { display: grid; gap: 3px; background: #1f2937; border: 3px solid #1f2937; border-radius: 8px; touch-action: manipulation; }
  .c { width: 30px; height: 30px; display: grid; place-items: center; background: #334155; border-radius: 4px; font-weight: 800; cursor: pointer; font-size: 15px; }
  .c.rev { background: #0b0f17; cursor: default; }
  .c.mine { background: #7f1d1d; }
  .c.flag { background: #1e293b; }
  .n1 { color: #60a5fa; } .n2 { color: #22c55e; } .n3 { color: #ef4444; } .n4 { color: #a78bfa; }
  .n5 { color: #f59e0b; } .n6 { color: #14b8a6; } .n7 { color: #e5e7eb; } .n8 { color: #9ca3af; }
  .msg { min-height: 22px; font-weight: 700; }
  footer { color: #4b5563; font-size: 12px; }
</style>
</head>
<body>
  <h1>💣 minesweep</h1>
  <div class="top">
    <span class="pill">💣 <span id="mines">0</span></span>
    <span class="pill">⏱ <span id="time">0</span></span>
    <select id="level">
      <option value="9,9,10">Fácil (9×9)</option>
      <option value="16,16,40">Médio (16×16)</option>
      <option value="16,30,99">Difícil (16×30)</option>
    </select>
    <button id="new">Novo</button>
  </div>
  <div id="grid"></div>
  <div class="msg" id="msg"></div>
  <footer>clique = revelar · clique direito / segurar = bandeira</footer>
  <script type="module" src="./game.js"></script>
</body>
</html>
